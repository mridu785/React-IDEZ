function showDashboard() {
  const projects = [...state.projects].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const body = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn primary" id="dashNew">New from template</button>
      <button class="btn" id="dashImport">Import ZIP</button>
      <input id="dashFilter" placeholder="Search projects…" style="flex:1;min-width:160px">
    </div>
    <div id="dashList" class="dashboard-grid"></div>
  `;
  openModal({ title: 'Projects', body, size: 'medium' });
  const list = $('#dashList');
  function render() {
    const q = ($('#dashFilter').value || '').toLowerCase();
    const filtered = projects.filter(p => p.name.toLowerCase().includes(q));
    list.innerHTML = '';
    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No projects yet. Create one from a template or import a ZIP.</div>';
      return;
    }
    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `<div class="pc-name">${escapeHtml(p.name)}</div>
        <div class="pc-meta">${Object.keys(p.files || {}).length} files · ${formatDate(p.updatedAt)}</div>
        <div class="pc-actions">
          <button class="btn small primary" data-act="open">Open</button>
          <button class="btn small" data-act="rename">Rename</button>
          <button class="btn small" data-act="duplicate">Duplicate</button>
          <button class="btn small" data-act="export">Export</button>
          <button class="btn small danger" data-act="delete">Delete</button>
        </div>`;
      card.querySelector('[data-act="open"]').onclick = () => { closeModal(); openProject(p.id); };
      card.querySelector('[data-act="rename"]').onclick = async () => {
        const name = prompt('Rename project:', p.name);
        if (!name || name === p.name) return;
        p.name = name; p.updatedAt = Date.now();
        await persistProject(p); render(); renderTopbar();
      };
      card.querySelector('[data-act="duplicate"]').onclick = async () => {
        const copy = JSON.parse(JSON.stringify(p));
        copy.id = uuid(); copy.name = p.name + ' copy';
        copy.createdAt = copy.updatedAt = Date.now();
        await persistProject(copy); state.projects = await dbGetAll('projects'); render();
      };
      card.querySelector('[data-act="export"]').onclick = () => exportProject(p);
      card.querySelector('[data-act="delete"]').onclick = async () => {
        if (!confirm('Delete "' + p.name + '"? A snapshot will be saved first.')) return;
        await saveSnapshot(p, 'before-delete');
        await dbDelete('projects', p.id);
        state.projects = await dbGetAll('projects');
        if (state.project && state.project.id === p.id) { state.project = null; renderAll(); }
        render(); toast('Project deleted. Snapshot saved.');
      };
      list.appendChild(card);
    });
  }
  render();
  $('#dashFilter').oninput = render;
  $('#dashNew').onclick = showTemplatePicker;
  $('#dashImport').onclick = () => $('#zipInput').click();
}

function showTemplatePicker() {
  const body = '<div class="template-grid" id="templateGrid"></div>';
  openModal({ title: 'Create from template', body, size: 'medium' });
  const grid = $('#templateGrid');
  Object.entries(TEMPLATES).forEach(([id, t]) => {
    const card = document.createElement('button');
    card.className = 'template-card';
    card.innerHTML = `<strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(t.description)}</span>`;
    card.onclick = async () => {
      const name = prompt('Project name:', t.name);
      if (!name) return;
      closeModal();
      await createProjectFromTemplate(id, name);
    };
    grid.appendChild(card);
  });
}

async function createProjectFromTemplate(templateId, name) {
  const t = TEMPLATES[templateId];
  if (!t) { toast('Unknown template.'); return; }
  const project = {
    id: uuid(), name: name || t.name, files: t.files(),
    entry: 'main.jsx', dependencies: { react: '18.3.1', 'react-dom': '18.3.1' },
    createdAt: Date.now(), updatedAt: Date.now(), templateId,
    openTabs: ['main.jsx', 'App.jsx']
  };
  await persistProject(project);
  state.projects = await dbGetAll('projects');
  await openProject(project.id);
  toast('Project created.');
}

async function openProject(id) {
  await saveProjectNow();
  disposeModels();
  let p;
  try { p = await dbGet('projects', id); }
  catch (e) { toast('Could not open project: ' + e.message); return; }
  if (!p) { toast('Project not found.'); return; }
  state.project = p;
  state.projects = state.projects.map(x => x.id === p.id ? p : x);
  state.openTabs = (p.openTabs || []).filter(f => p.files[f]);
  state.activeFile = state.openTabs[0] || Object.keys(p.files)[0] || null;
  if (state.activeFile && !state.openTabs.includes(state.activeFile)) state.openTabs.push(state.activeFile);
  state.dirtyFiles.clear();
  state.diagnostics = [];
  state.console = [];
  state.settings.lastProjectId = p.id;
  persistSettings();
  closeModal();
  renderAll();
  if (state.activeFile) openFile(state.activeFile);
  if (state.settings.autoRun) compileAndRun({ manual: false });
  setStatus('idle');
}

/* -------------------------------------------------------------------------
   Snapshots
   ------------------------------------------------------------------------- */
async function saveSnapshot(project, reason) {
  try {
    const snapshot = { id: uuid(), projectId: project.id, reason, createdAt: Date.now(), data: JSON.parse(JSON.stringify(project)) };
    await dbPut('snapshots', snapshot);
    return snapshot;
  } catch (e) { console.warn('Snapshot failed', e); return null; }
}

/* -------------------------------------------------------------------------
   ZIP export / import
   ------------------------------------------------------------------------- */
async function exportProject(project) {
  if (!project) { toast('No project to export.'); return; }
  try {
    const zip = new JSZip();
    for (const [path, file] of Object.entries(project.files || {})) {
      if (file.encoding === 'base64') zip.file(path, file.content, { base64: true });
      else zip.file(path, file.content || '');
    }
    if (!project.files['package.json']) zip.file('package.json', PKG(project.name));
    zip.file('README.md', '# ' + project.name + '\n\nExported from ReactLab.\n\n## Run locally\n\n```bash\nnpm install\nnpm run dev\n```\n\n## Runtime\n\nThis project was authored in a browser-based React IDE. It uses React 18 and standard browser APIs. Packages outside the supported browser runtime are not included.\n');
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    downloadBlob(blob, (project.name || 'reactlab-project').replace(/[^\w.-]+/g, '-') + '.zip');
    toast('ZIP export started.');
  } catch (err) { toast('Export failed: ' + err.message); }
}

async function importZip(file) {
  try {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const entries = Object.values(zip.files).filter(f => !f.dir);
    if (!entries.length) { toast('ZIP contains no files.'); return; }
    if (entries.length > 500) { toast('ZIP rejected: too many files (limit 500).'); return; }
    if (file.size > 25 * 1024 * 1024) { toast('ZIP rejected: file is larger than 25 MB.'); return; }

    const files = {};
    const skipped = [];
    for (const entry of entries) {
      const raw = entry.name;
      if (raw.includes('..') || raw.startsWith('/') || /^[a-zA-Z]:/.test(raw)) {
        toast('ZIP rejected: unsafe path "' + raw + '".'); return;
      }
      const path = normalizePath(raw);
      if (!path) continue;
      const ext = extname(path);
      try {
        if (['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.ico', '.woff', '.woff2', '.ttf'].includes(ext)) {
          files[path] = { content: await entry.async('base64'), encoding: 'base64' };
        } else if (['.js', '.jsx', '.ts', '.tsx', '.css', '.html', '.json', '.md', '.txt', '.svg'].includes(ext) || !ext) {
          files[path] = { content: await entry.async('string') };
        } else {
          skipped.push(path);
        }
      } catch (e) { skipped.push(path); }
    }
    if (!Object.keys(files).length) { toast('No supported files found in ZIP.'); return; }
    const name = file.name.replace(/\.zip$/i, '') || 'Imported project';
    const project = {
      id: uuid(), name: name + ' (imported)', files, entry: files['main.jsx'] ? 'main.jsx' : (Object.keys(files).find(p => /\.(jsx|tsx|js|ts)$/.test(p)) || Object.keys(files)[0]),
      dependencies: { react: '18.3.1', 'react-dom': '18.3.1' },
      createdAt: Date.now(), updatedAt: Date.now(), templateId: 'imported',
      openTabs: Object.keys(files).slice(0, 2)
    };
    await persistProject(project);
    state.projects = await dbGetAll('projects');
    await openProject(project.id);
    toast('Imported ' + Object.keys(files).length + ' files.' + (skipped.length ? ' Skipped ' + skipped.length + ' unsupported files.' : ''));
  } catch (err) { toast('Import failed: ' + (err.message || err)); }
}

/* -------------------------------------------------------------------------
   Search / command palette
   ------------------------------------------------------------------------- */
function searchProject(query) {
  const q = String(query || '').toLowerCase();
  if (!q || !state.project) return [];
  const results = [];
  for (const [path, file] of Object.entries(state.project.files || {})) {
    if (typeof file.content !== 'string') continue;
    const lines = file.content.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const idx = lines[i].toLowerCase().indexOf(q);
      if (idx !== -1) results.push({ path, line: i + 1, column: idx + 1, text: lines[i].trim().slice(0, 240) });
      if (results.length >= 500) return results;
    }
  }
  return results;
}

function showSearch() {
  const body = `
    <div style="display:flex;gap:6px">
      <input id="searchInput" placeholder="Search across project…" style="flex:1" autofocus>
      <button id="searchReplace" class="btn">Replace all…</button>
    </div>
    <div id="searchResults" style="margin-top:10px;max-height:50vh;overflow:auto;border:1px solid var(--border);border-radius:6px"></div>
  `;
  openModal({ title: 'Search project', body, size: 'medium' });
  const input = $('#searchInput'), results = $('#searchResults');
  function run() {
    const list = searchProject(input.value);
    results.innerHTML = '';
    if (!input.value.trim()) { results.innerHTML = '<div class="empty-state">Type to search all project files.</div>'; return; }
    if (!list.length) { results.innerHTML = '<div class="empty-state">No matches.</div>'; return; }
    list.forEach(r => {
      const row = document.createElement('div');
      row.className = 'search-result';
      row.innerHTML = `<div class="file">${escapeHtml(r.path)}:${r.line}:${r.column}</div><div class="line">${escapeHtml(r.text)}</div>`;
      row.onclick = () => { closeModal(); openFile(r.path, r.line, r.column); };
      results.appendChild(row);
    });
  }
  input.oninput = run;
  input.onkeydown = e => { if (e.key === 'Enter') run(); };
  $('#searchReplace').onclick = () => {
    const find = input.value;
    if (!find) { toast('Enter search text first.'); return; }
    const replace = prompt('Replace "' + find + '" with:', '');
    if (replace === null) return;
    if (!confirm('Replace all occurrences across the project?')) return;
    let count = 0;
    for (const file of Object.values(state.project.files)) {
      if (typeof file.content !== 'string') continue;
      const before = file.content;
      file.content = file.content.split(find).join(replace);
      if (file.content !== before) count++;
    }
    state.project.updatedAt = Date.now();
    scheduleAutosave(); renderTabs(); renderFileTree();
    if (state.activeFile) openFile(state.activeFile);
    if (state.settings.autoRun) scheduleCompile();
    toast('Replaced text in ' + count + ' file(s).');
    run();
  };
  setTimeout(() => input.focus(), 50);
}

function showCommandPalette() {
  const body = `<input id="paletteInput" placeholder="Type a command or file name…" style="width:100%" autofocus><div id="paletteList" class="palette-list"></div>`;
  openModal({ title: 'Command palette', body, size: 'small' });
  const input = $('#paletteInput'), list = $('#paletteList');
  const commands = [
    { label: 'Run preview', hint: 'Ctrl+Enter', run: () => compileAndRun({ manual: true }) },
    { label: 'Stop preview', hint: '', run: stopPreview },
    { label: 'Save project', hint: 'Ctrl+S', run: saveProjectNow },
    { label: 'New file', hint: '', run: createFilePrompt },
    { label: 'New folder', hint: '', run: createFolderPrompt },
    { label: 'Search project', hint: '', run: showSearch },
    { label: 'Project dashboard', hint: '', run: showDashboard },
    { label: 'Settings', hint: '', run: showSettings },
    { label: 'Toggle theme', hint: '', run: toggleTheme },
    { label: 'Export ZIP', hint: '', run: () => exportProject(state.project) },
    { label: 'Import ZIP', hint: '', run: () => $('#zipInput').click() },
    { label: 'Toggle console panel', hint: '', run: () => { document.body.classList.toggle('panel-collapsed'); } },
    { label: 'Full-screen preview', hint: '', run: toggleFullscreenPreview },
    ...(state.project ? Object.keys(state.project.files).map(path => ({ label: 'Open ' + path, hint: 'file', run: () => openFile(path) })) : [])
  ];
  let filtered = commands, active = 0;
  function render() {
    list.innerHTML = '';
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">No commands.</div>'; return; }
    filtered.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'palette-item' + (i === active ? ' active' : '');
      btn.innerHTML = `<span>${escapeHtml(c.label)}</span>${c.hint ? `<span class="hint">${escapeHtml(c.hint)}</span>` : ''}`;
      btn.onclick = () => { closeModal(); c.run(); };
      list.appendChild(btn);
    });
  }
  function filter() {
    const q = input.value.toLowerCase().trim();
    filtered = commands.filter(c => c.label.toLowerCase().includes(q));
    active = 0; render();
  }
  input.oninput = filter;
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(filtered.length - 1, active + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (filtered[active]) { closeModal(); filtered[active].run(); } }
  };
  render(); setTimeout(() => input.focus(), 50);
}

/* -------------------------------------------------------------------------
   Settings
   ------------------------------------------------------------------------- */
function showSettings() {
  const s = state.settings;
  const body = `
    <div class="form-grid">
      <div class="form-row"><label>Theme</label><select id="setTheme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
      <div class="form-row"><label>Font size</label><input id="setFontSize" type="number" min="10" max="28" value="${s.fontSize}"></div>
      <div class="form-row"><label>Font family</label><input id="setFontFamily" value="${escapeHtml(s.fontFamily)}"></div>
      <div class="form-row"><label>Tab size</label><select id="setTabSize"><option>2</option><option>4</option><option>8</option></select></div>
      <div class="form-row"><label>Word wrap</label><select id="setWordWrap"><option value="off">Off</option><option value="on">On</option><option value="wordWrapColumn">Column</option></select></div>
      <div class="form-row"><label>Default viewport</label><select id="setViewport"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select></div>
      <div class="form-row"><label>Entry file</label><input id="setEntry" value="${escapeHtml(s.entry)}"></div>
      <div class="form-row"><label>Preview debounce (ms)</label><input id="setDebounce" type="number" min="250" max="5000" value="${s.previewDebounce}"></div>
    </div>
    <div class="check-row"><input type="checkbox" id="setMinimap"><label for="setMinimap">Minimap</label></div>
    <div class="check-row"><input type="checkbox" id="setLineNumbers"><label for="setLineNumbers">Line numbers</label></div>
    <div class="check-row"><input type="checkbox" id="setAutoRun"><label for="setAutoRun">Run automatically after edits</label></div>
    <div class="check-row"><input type="checkbox" id="setConsole"><label for="setConsole">Show console panel</label></div>
    <div class="check-row"><input type="checkbox" id="setErrorOverlay"><label for="setErrorOverlay">Show runtime error overlay</label></div>
    <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="setStorage">Storage estimate</button>
      <button class="btn danger" id="setClear">Clear all local data…</button>
    </div>
    <div id="storageDetail" style="margin-top:8px;font-size:11px;color:var(--text-muted)"></div>
  `;
  openModal({ title: 'Settings', body, size: 'medium', footer: '<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveSettings">Save settings</button>' });
  $('#setTheme').value = s.theme; $('#setTabSize').value = String(s.tabSize); $('#setWordWrap').value = s.wordWrap;
  $('#setViewport').value = s.defaultViewport; $('#setMinimap').checked = !!s.minimap;
  $('#setLineNumbers').checked = !!s.lineNumbers; $('#setAutoRun').checked = !!s.autoRun;
  $('#setConsole').checked = !!s.consoleVisible; $('#setErrorOverlay').checked = !!s.errorOverlay;
  $('#setStorage').onclick = async () => {
    const d = $('#storageDetail');
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      d.textContent = 'Usage: ' + (est.usage / 1024 / 1024).toFixed(1) + ' MB of approximately ' + (est.quota / 1024 / 1024 / 1024).toFixed(1) + ' GB quota.';
    } else d.textContent = 'Storage estimate is not supported by this browser.';
  };
  $('#setClear').onclick = async () => {
    if (!confirm('Delete ALL ReactLab projects and preferences from this browser? This cannot be undone.')) return;
    if (!confirm('Really delete all local data? Export any important projects first.')) return;
    try {
      await new Promise((res, rej) => {
        const req = indexedDB.deleteDatabase(DB_NAME);
        req.onsuccess = res; req.onerror = () => rej(req.error); req.onblocked = () => rej(new Error('Blocked'));
      });
      location.reload();
    } catch (e) { toast('Could not clear data: ' + e.message); }
  };
  $('#saveSettings').onclick = async () => {
    state.settings.theme = $('#setTheme').value;
    state.settings.fontSize = Math.max(10, Math.min(28, +$('#setFontSize').value || 14));
    state.settings.fontFamily = $('#setFontFamily').value || DEFAULT_SETTINGS.fontFamily;
    state.settings.tabSize = +$('#setTabSize').value || 2;
    state.settings.wordWrap = $('#setWordWrap').value;
    state.settings.defaultViewport = $('#setViewport').value;
    state.settings.entry = normalizePath($('#setEntry').value) || 'main.jsx';
    state.settings.previewDebounce = Math.max(250, Math.min(5000, +$('#setDebounce').value || 700));
    state.settings.minimap = $('#setMinimap').checked;
    state.settings.lineNumbers = $('#setLineNumbers').checked;
    state.settings.autoRun = $('#setAutoRun').checked;
    state.settings.consoleVisible = $('#setConsole').checked;
    state.settings.errorOverlay = $('#setErrorOverlay').checked;
    await persistSettings();
    applySettings();
    closeModal();
    toast('Settings saved.');
  };
}

function applySettings() {
  document.body.dataset.theme = state.settings.theme;
  $('#viewportSelect').value = state.settings.defaultViewport;
  setViewport(state.settings.defaultViewport);
  if (state.editor) {
    state.editor.updateOptions({
      theme: monacoTheme(), fontSize: state.settings.fontSize, fontFamily: state.settings.fontFamily,
      tabSize: state.settings.tabSize, wordWrap: state.settings.wordWrap,
      minimap: { enabled: !!state.settings.minimap }, lineNumbers: state.settings.lineNumbers ? 'on' : 'off'
    });
  }
  if (!state.settings.consoleVisible) document.body.classList.add('panel-collapsed');
  else document.body.classList.remove('panel-collapsed');
}

function toggleTheme() {
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  persistSettings(); applySettings();
}
function setViewport(v) {
  const el = $('#previewViewport');
  el.className = v;
}
function toggleFullscreenPreview() {
  const pane = $('#previewPane');
  pane.classList.toggle('fullscreen');
  document.body.classList.toggle('preview-fullscreen');
}
function switchMobileView(view) {
  state.mobileView = view;
  document.body.className = document.body.className.replace(/mobile-view-\w+/g, '');
  document.body.classList.add('mobile-view-' + view);
  $$('#mobileNav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}

/* -------------------------------------------------------------------------
   Modal helpers
   ------------------------------------------------------------------------- */
function openModal({ title, body, size = '', footer = '' }) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
    <div class="modal-head"><h2>${escapeHtml(title)}</h2><button class="icon-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
  </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay || e.target.closest('[data-close]')) closeModal(); });
  $('#modalRoot').appendChild(overlay);
  setTimeout(() => { const f = overlay.querySelector('input,select,button'); if (f) f.focus(); }, 30);
}
function closeModal() {
  const m = $('#activeModal');
  if (m) m.remove();
}

/* -------------------------------------------------------------------------
   Rendering
   ------------------------------------------------------------------------- */
function renderTopbar() {
  $('#projectName').textContent = state.project ? state.project.name : 'No project';
  $('#btnRun').disabled = !state.project;
}
function renderAll() {
  renderTopbar();
  renderFileTree();
  renderTabs();
  renderProblems();
  renderConsole();
  const storage = $('#storageInfo');
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(est => {
      storage.textContent = 'Storage: ' + (est.usage / 1024 / 1024).toFixed(1) + ' MB used';
    }).catch(() => { storage.textContent = 'Storage: —'; });
  }
  if (state.settings.consoleVisible) document.body.classList.remove('panel-collapsed');
  else document.body.classList.add('panel-collapsed');
  setViewport(state.settings.defaultViewport || 'desktop');
  switchMobileView(window.innerWidth <= 760 ? (state.settings.mobileView || 'editor') : 'editor');
}

/* -------------------------------------------------------------------------
   Events / shortcuts
   ------------------------------------------------------------------------- */
function bindEvents() {
  $('#btnDashboard').onclick = showDashboard;
  $('#btnProject').onclick = showDashboard;
  $('#btnRun').onclick = () => compileAndRun({ manual: true });
  $('#btnStop').onclick = stopPreview;
  $('#btnPalette').onclick = showCommandPalette;
  $('#btnSearch').onclick = showSearch;
  $('#btnTheme').onclick = toggleTheme;
  $('#btnSettings').onclick = showSettings;
  $('#btnRefresh').onclick = refreshPreview;
  $('#btnFullscreenPreview').onclick = toggleFullscreenPreview;
  $('#btnToggleConsole').onclick = () => { document.body.classList.toggle('panel-collapsed'); switchMobileView('console'); };
  $('#btnNewFile').onclick = createFilePrompt;
  $('#btnNewFolder').onclick = createFolderPrompt;
  $('#fileFilter').oninput = renderFileTree;
  $('#btnClearConsole').onclick = clearConsole;
  $('#btnCopyConsole').onclick = copyConsole;
  $('#btnCollapsePanel').onclick = () => document.body.classList.toggle('panel-collapsed');
  $('#consoleFilter').onchange = e => { state.consoleFilter = e.target.value; renderConsole(); };
  $('#consoleSearch').oninput = e => { state.consoleSearch = e.target.value; renderConsole(); };
  $('#viewportSelect').onchange = e => setViewport(e.target.value);
  $$('.panel-tabs button[data-panel]').forEach(b => b.onclick = () => showPanel(b.dataset.panel));
  $$('#mobileNav button').forEach(b => b.onclick = () => switchMobileView(b.dataset.view));
  $('#zipInput').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) await importZip(f);
  };

  window.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveProjectNow(); }
    else if (mod && e.key === 'Enter') { e.preventDefault(); compileAndRun({ manual: true }); }
    else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); showCommandPalette(); }
    else if (mod && e.key.toLowerCase() === 'p') { e.preventDefault(); showCommandPalette(); }
    else if (mod && e.key.toLowerCase() === 'f' && !state.editor) { e.preventDefault(); showSearch(); }
    else if (e.key === 'Escape') closeModal();
  });

  window.addEventListener('beforeunload', e => {
    if (state.dirtyFiles.size && state.project) {
      // Best-effort save; IndexedDB writes are asynchronous and may not finish.
      saveProjectNow();
    }
  });

  // Split handle
  let dragging = false;
  const handle = $('#splitHandle');
  handle.addEventListener('mousedown', () => { dragging = true; document.body.style.cursor = 'col-resize'; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const workspace = $('#workspace');
    const rect = workspace.getBoundingClientRect();
    const pct = Math.max(25, Math.min(75, ((e.clientX - rect.left) / rect.width) * 100));
    $('#editorPane').style.flexBasis = pct + '%';
    $('#previewPane').style.flexBasis = (100 - pct) + '%';
  });
  window.addEventListener('mouseup', () => { dragging = false; document.body.style.cursor = ''; });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (window.innerWidth <= 760) switchMobileView(state.mobileView || 'editor');
      else { document.body.classList.remove('mobile-view-files','mobile-view-editor','mobile-view-preview','mobile-view-console','mobile-view-problems'); }
    }, 150);
  });
}

/* -------------------------------------------------------------------------
   Init
   ------------------------------------------------------------------------- */
(async function init() {
  bindEvents();
  try {
    setLoaderStatus('Loading JSX compiler…');
    await loadScript(CDN.babel);
    setLoaderStatus('Loading ZIP library…');
    await loadScript(CDN.jszip);
    setLoaderStatus('Opening project storage…');
    state.db = await openDatabase();
    await loadSettings();
    state.projects = await dbGetAll('projects');
    document.body.dataset.theme = state.settings.theme;
    applySettings();
    renderAll();
    hideLoader();

    setLoaderStatus('Loading Monaco Editor…');
    initMonaco().then(() => {
      if (state.activeFile) openFile(state.activeFile);
    });

    const last = state.settings.lastProjectId;
    if (last && state.projects.some(p => p.id === last)) {
      await openProject(last);
    } else if (state.projects.length) {
      await openProject(state.projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0].id);
    } else {
      showDashboard();
    }
  } catch (err) {
    showLoaderError(err);
  }
})();
</script>
